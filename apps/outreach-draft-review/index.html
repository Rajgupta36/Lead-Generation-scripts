<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NexStudio outreach draft review desk."
    />
    <title>NexStudio Outreach Desk</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">N</div>
          <div>
            <p>NexStudio</p>
            <h1>Outreach Desk</h1>
          </div>
        </div>

        <div class="run-summary" aria-label="Campaign summary">
          <span><strong id="leadTotal">0</strong> leads</span>
          <span><strong id="draftTotal">0</strong> drafts</span>
          <span><strong id="directTotal">0</strong> direct</span>
          <span><strong id="inboxTotal">0</strong> inbox</span>
          <span class="status-dot">Review ready</span>
          <a href="./workflow-control.html" class="workflow-link">Workflow control</a>
        </div>
      </header>

      <div class="toolbar">
        <label class="search-control" for="leadSearch">
          <i data-lucide="search" aria-hidden="true"></i>
          <input
            id="leadSearch"
            type="search"
            placeholder="Search company or contact"
            autocomplete="off"
          />
        </label>

        <label class="select-control" for="segmentFilter">
          <span>Segment</span>
          <select id="segmentFilter">
            <option value="all">All</option>
            <option value="agency_owner">Agencies</option>
            <option value="coach">Coaches</option>
            <option value="small_business">Small business</option>
          </select>
        </label>

        <label class="select-control" for="recipientFilter">
          <span>Recipient</span>
          <select id="recipientFilter">
            <option value="all">All</option>
            <option value="decision_maker">Decision makers</option>
            <option value="business_inbox">Business inboxes</option>
          </select>
        </label>

        <label class="select-control" for="countryFilter">
          <span>Country</span>
          <select id="countryFilter">
            <option value="all">All English markets</option>
            <option value="USA">USA</option>
            <option value="Canada">Canada</option>
            <option value="United Kingdom">United Kingdom</option>
            <option value="Ireland">Ireland</option>
            <option value="Australia">Australia</option>
            <option value="New Zealand">New Zealand</option>
          </select>
        </label>
      </div>

      <main class="workspace">
        <aside class="lead-pane" aria-label="Reviewed leads">
          <div class="pane-heading">
            <h2>Reviewed leads</h2>
            <span id="filteredCount">0</span>
          </div>
          <div class="lead-list-header" aria-hidden="true">
            <span>Client</span><span>Tags</span><span>Country</span><span>Location</span><span>Email</span><span>Offer</span>
          </div>
          <div id="leadList" class="lead-list"></div>
        </aside>

        <div
          id="paneResizer"
          class="pane-resizer"
          role="separator"
          aria-label="Resize lead list and signal panel"
          aria-orientation="vertical"
          aria-valuemin="30"
          aria-valuemax="75"
          aria-valuenow="58"
          tabindex="0"
        >
          <span class="pane-resizer-grip" aria-hidden="true"></span>
        </div>

        <section class="draft-pane" aria-live="polite">
          <div id="emptyState" class="empty-state" hidden>
            <i data-lucide="inbox" aria-hidden="true"></i>
            <h2>No matching leads</h2>
          </div>

          <div id="draftContent">
            <div class="company-header">
              <div class="company-identity">
                <div class="company-avatar">
                  <img id="companyFavicon" alt="" />
                  <span id="companyInitials" aria-hidden="true"></span>
                </div>
                <div>
                  <p id="companySegment" class="eyebrow"></p>
                  <h2 id="companyName"></h2>
                  <p id="contactLine" class="contact-line"></p>
                </div>
              </div>
              <a
                id="websiteLink"
                class="icon-button"
                href="#"
                target="_blank"
                rel="noreferrer"
                title="Open company website"
                aria-label="Open company website"
              >
                <i data-lucide="external-link" aria-hidden="true"></i>
              </a>
            </div>

            <div class="signal-strip">
              <div>
                <span>Offer</span>
                <strong id="offerName"></strong>
              </div>
              <div>
                <span>Range</span>
                <strong id="priceRange"></strong>
              </div>
              <div>
                <span>Location</span>
                <strong id="location"></strong>
              </div>
              <div>
                <span>Tags</span>
                <strong id="leadTags"></strong>
              </div>
            </div>

            <div class="compact-details" aria-label="Lead details">
              <div class="detail-row"><span>Client</span><div class="copy-field"><input id="clientValue" class="copy-input" readonly /><button type="button" class="copy-button" id="copyClient">Copy</button></div></div>
              <div class="detail-row"><span>Country</span><div class="copy-field"><input id="countryValue" class="copy-input" readonly /><button type="button" class="copy-button" id="copyCountry">Copy</button></div></div>
              <div class="detail-row"><span>Website</span><div class="copy-field"><input id="websiteValue" class="copy-input" readonly /><button type="button" class="copy-button" id="copyWebsite">Copy</button></div></div>
            </div>

            <div class="observation-band clutter-detail">
              <i data-lucide="scan-search" aria-hidden="true"></i>
              <div>
                <span id="auditLabel">Website signal</span>
                <p id="observation"></p>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
